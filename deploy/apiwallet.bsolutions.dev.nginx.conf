server {
    listen 80;
    listen [::]:80;
    server_name apiwallet.bsolutions.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apiwallet.bsolutions.dev;

    root /var/www/wallet-finanzas/public;
    index index.php;

    # Replace these paths with the certificate issued for apiwallet.bsolutions.dev.
    ssl_certificate /etc/letsencrypt/live/apiwallet.bsolutions.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiwallet.bsolutions.dev/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
